name: SatNOGS historical observations
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: satnogs-archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public SatNOGS historical observations
        run: node scripts/satnogs_collector.js
      - name: Commit updated archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/satnogs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update SatNOGS historical archive'
            git push
          else
            echo 'No changes'
          fi
